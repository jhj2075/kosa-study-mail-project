<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-shell">
  <section class="auth-panel">
    <header class="auth-header">
      <p class="eyebrow">Mail Service</p>
      <h1>로그인</h1>
      <p>예약 메일 서비스를 이용하려면 로그인해주세요.</p>
    </header>

    <p class="flash success" th:if="${message}" th:text="${message}"></p>
    <p class="flash error" th:if="${error}" th:text="${error}"></p>

    <form method="post" th:object="${loginRequest}" th:action="@{/login}">
      <div class="field-row">
        <label for="loginId">아이디</label>
        <input id="loginId" type="text" th:field="*{loginId}" autocomplete="username" autofocus>
      </div>

      <div class="field-row">
        <label for="password">비밀번호</label>
        <input id="password" type="password" th:field="*{password}" autocomplete="current-password">
      </div>

      <button class="primary-button" type="submit">로그인</button>
    </form>

    <p class="auth-link">
      계정이 없나요?
      <a th:href="@{/register}">회원가입</a>
    </p>
  </section>
</main>
</body>
</html>
